name: ARM Pin Literals (one-shot)

# Builds and runs abi_pin_literals-t on a GitHub-hosted arm64 runner to
# emit the linux_arm VEF_*_ABI_HASH_LINUX_ARM values, which the regular
# self-hosted x86 CI cannot produce. Delete this workflow once those
# values are pasted into the ABI headers.
on:
  push:
    branches: [dbentley/abi_sig]

jobs:
  arm-pin-literals:
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source

      - name: Install dependencies
        run: sudo source/scripts/setup_linux_build_env.sh

      - name: Configure cmake
        run: |
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          cmake "$GITHUB_WORKSPACE/source" \
            -DWITH_DEBUG=1 \
            -DDOWNLOAD_BOOST=1 \
            -DWITH_BOOST=/tmp/boost

      - name: Build abi_pin_literals-t
        working-directory: ${{ env.BUILD_DIR }}
        run: make -j$(nproc) abi_pin_literals-t

      - name: Run abi_pin_literals-t (expected to fail; we want the values)
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          ./runtime_output_directory/abi_pin_literals-t 2>&1 | tee /tmp/pin.log || true
          echo
          echo "=========================================="
          echo "  Paste these into the SDK ABI headers:"
          echo "=========================================="
          grep -E '#define VEF_.*_ABI_HASH_LINUX_ARM' /tmp/pin.log || true
