name: Release

# Triggered by version tags (e.g. 0.0.3, 0.0.3-dev) or manually.
# Builds once per platform, then fans out to symbol extraction, prod packaging,
# and dev packaging in parallel, before attaching all artifacts to a release.
#
# Runner requirements:
#   - [self-hosted, linux, x86_64]    - existing CI runner
#   - ubuntu-24.04-arm (GitHub-hosted) - ARM64
#   - macos-latest (GitHub-hosted)    - Apple Silicon

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for (e.g. 0.0.3)'
        required: true

jobs:

  # ── Build & test ──────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x86_64]
            platform: linux-x86_64
            os: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            os: linux
          - runner: macos-latest
            platform: macos-arm64
            os: macos

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      SOURCE_DIR: ${{ github.workspace }}/source

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: sudo source/scripts/setup_linux_build_env.sh

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos'
        run: brew install bison cmake openssl

      - name: Cache Boost
        uses: actions/cache@v4
        with:
          path: /tmp/boost
          key: boost-${{ runner.os }}-${{ runner.arch }}

      - name: Build server
        run: |
          mkdir -p "$BUILD_DIR"

          EXTRA_FLAGS="-DDOWNLOAD_BOOST=1 -DWITH_BOOST=/tmp/boost -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          if [ "${{ matrix.os }}" = "macos" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS -DWITH_SSL=$(brew --prefix openssl)"
          fi

          BUILD_DIR="$BUILD_DIR" \
          SOURCE_DIR="$SOURCE_DIR" \
          CMAKE_EXTRA_FLAGS="$EXTRA_FLAGS" \
            source/scripts/build-ci.sh

      - name: Run server tests
        run: source/scripts/run_server_tests.sh "$BUILD_DIR"

      - name: Pack raw build artifact
        run: |
          mkdir -p raw_build
          # Copy only what downstream jobs need; avoids uploading the full build tree.
          cp -r "$BUILD_DIR/runtime_output_directory" raw_build/
          cp -r "$BUILD_DIR/library_output_directory" raw_build/
          cp -r "$BUILD_DIR/plugin_output_directory"  raw_build/
          cp -r "$BUILD_DIR/villagesql-extension-sdk-"* raw_build/ 2>/dev/null || true
          # Pack the SDK tarball as well (used by publish job)
          cp "$BUILD_DIR"/villagesql-extension-sdk-*.tar.gz raw_build/ 2>/dev/null || true
          tar czf raw-build-${{ matrix.platform }}.tar.gz raw_build

      - name: Upload raw build
        uses: actions/upload-artifact@v4
        with:
          name: raw-build-${{ matrix.platform }}
          path: raw-build-${{ matrix.platform }}.tar.gz

  # ── Build & test bundled extensions ──────────────────────────────────────
  build-and-test-extensions:
    name: Extensions (${{ matrix.platform }})
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x86_64]
            platform: linux-x86_64
            os: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            os: linux
          - runner: macos-latest
            platform: macos-arm64
            os: macos

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      SOURCE_DIR: ${{ github.workspace }}/source

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: raw-build-${{ matrix.platform }}

      - name: Unpack raw build
        run: |
          mkdir -p "$BUILD_DIR"
          tar xzf raw-build-${{ matrix.platform }}.tar.gz
          cp -r raw_build/runtime_output_directory "$BUILD_DIR/"
          cp -r raw_build/library_output_directory "$BUILD_DIR/"
          cp -r raw_build/plugin_output_directory  "$BUILD_DIR/"
          # Restore SDK staging directories
          for d in raw_build/villagesql-extension-sdk-*/; do
            [[ -d "$d" ]] && cp -r "$d" "$BUILD_DIR/"
          done

      - name: Build bundled extensions
        run: |
          # Find the SDK directory in the build tree
          SDK_DIR=$(ls -d "$BUILD_DIR"/villagesql-extension-sdk-*/ 2>/dev/null | head -1)
          [[ -n "$SDK_DIR" ]] || { echo "SDK dir not found"; exit 1; }

          EXT_CLONES_DIR="$(mktemp -d)"
          trap 'rm -rf "$EXT_CLONES_DIR"' EXIT

          EXTENSION_CLONES_DIR="$EXT_CLONES_DIR" \
            source/scripts/build_bundled_extensions.sh \
              "$SDK_DIR" \
              "$BUILD_DIR/veb_output_directory"

          source/scripts/test_extension_vebs.sh \
            "$BUILD_DIR" \
            "$EXT_CLONES_DIR"

      - name: Upload VEB files
        uses: actions/upload-artifact@v4
        with:
          name: veb-files-${{ matrix.platform }}
          path: ${{ env.BUILD_DIR }}/veb_output_directory/*.veb

  # ── Extract symbols ───────────────────────────────────────────────────────
  package-symbols:
    name: Symbols (${{ matrix.platform }})
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x86_64]
            platform: linux-x86_64
            os: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            os: linux
          - runner: macos-latest
            platform: macos-arm64
            os: macos

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      OUTPUT_DIR: ${{ github.workspace }}/output
      SOURCE_DIR: ${{ github.workspace }}/source

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: raw-build-${{ matrix.platform }}

      - name: Unpack raw build
        run: |
          mkdir -p "$BUILD_DIR" "$OUTPUT_DIR"
          tar xzf raw-build-${{ matrix.platform }}.tar.gz
          cp -r raw_build/runtime_output_directory "$BUILD_DIR/"
          cp -r raw_build/library_output_directory "$BUILD_DIR/"
          # Also copy SDK tarballs for upload
          cp raw_build/villagesql-extension-sdk-*.tar.gz "$OUTPUT_DIR"/ 2>/dev/null || true

      - name: Extract symbols
        run: |
          mkdir -p "$OUTPUT_DIR"
          source/scripts/extract_symbols.sh "$BUILD_DIR" "$OUTPUT_DIR"

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ matrix.platform }}
          path: ${{ env.OUTPUT_DIR }}/villagesql-symbols-*.tar.gz

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}
          path: ${{ env.OUTPUT_DIR }}/villagesql-extension-sdk-*.tar.gz

  # ── Package production server ─────────────────────────────────────────────
  package-prod:
    name: Prod Package (${{ matrix.platform }})
    needs: [build-and-test, build-and-test-extensions]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x86_64]
            platform: linux-x86_64
            os: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            os: linux
          - runner: macos-latest
            platform: macos-arm64
            os: macos

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      OUTPUT_DIR: ${{ github.workspace }}/output
      SOURCE_DIR: ${{ github.workspace }}/source

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: raw-build-${{ matrix.platform }}

      - name: Download VEB files
        uses: actions/download-artifact@v4
        with:
          name: veb-files-${{ matrix.platform }}
          path: veb_files/

      - name: Unpack raw build
        run: |
          mkdir -p "$BUILD_DIR"
          tar xzf raw-build-${{ matrix.platform }}.tar.gz
          cp -r raw_build/runtime_output_directory "$BUILD_DIR/"
          cp -r raw_build/library_output_directory "$BUILD_DIR/"
          cp -r raw_build/plugin_output_directory  "$BUILD_DIR/"

      - name: Strip binaries
        run: |
          source/scripts/strip_binaries.sh "$BUILD_DIR/runtime_output_directory"
          source/scripts/strip_binaries.sh "$BUILD_DIR/library_output_directory"
          source/scripts/strip_binaries.sh "$BUILD_DIR/plugin_output_directory"

      - name: Package prod server
        run: |
          mkdir -p "$OUTPUT_DIR"
          BUILD_DIR="$BUILD_DIR" \
          OUTPUT_DIR="$OUTPUT_DIR" \
          VEB_DIR="${{ github.workspace }}/veb_files" \
            source/scripts/package_prod_server.sh

      - name: Upload prod package
        uses: actions/upload-artifact@v4
        with:
          name: prod-${{ matrix.platform }}
          path: ${{ env.OUTPUT_DIR }}/villagesql-server-*.tar.gz

  # ── Package development server ────────────────────────────────────────────
  package-dev:
    name: Dev Package (${{ matrix.platform }})
    needs: [build-and-test, build-and-test-extensions]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, x86_64]
            platform: linux-x86_64
            os: linux
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            os: linux
          - runner: macos-latest
            platform: macos-arm64
            os: macos

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      OUTPUT_DIR: ${{ github.workspace }}/output
      SOURCE_DIR: ${{ github.workspace }}/source

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: source
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download raw build
        uses: actions/download-artifact@v4
        with:
          name: raw-build-${{ matrix.platform }}

      - name: Download VEB files
        uses: actions/download-artifact@v4
        with:
          name: veb-files-${{ matrix.platform }}
          path: veb_files/

      - name: Unpack raw build
        run: |
          mkdir -p "$BUILD_DIR"
          tar xzf raw-build-${{ matrix.platform }}.tar.gz
          cp -r raw_build/runtime_output_directory "$BUILD_DIR/"
          cp -r raw_build/library_output_directory "$BUILD_DIR/"
          cp -r raw_build/plugin_output_directory  "$BUILD_DIR/"

      - name: Strip binaries
        run: |
          source/scripts/strip_binaries.sh "$BUILD_DIR/runtime_output_directory"
          source/scripts/strip_binaries.sh "$BUILD_DIR/library_output_directory"
          source/scripts/strip_binaries.sh "$BUILD_DIR/plugin_output_directory"

      - name: Package dev server
        run: |
          mkdir -p "$OUTPUT_DIR"
          BUILD_DIR="$BUILD_DIR" \
          OUTPUT_DIR="$OUTPUT_DIR" \
          VEB_DIR="${{ github.workspace }}/veb_files" \
            source/scripts/package_dev_server.sh

      - name: Run integration tests
        run: |
          TARBALL=$(ls "$OUTPUT_DIR"/*.tar.gz | head -1)
          TEST_DIR=$(mktemp -d)
          tar xzf "$TARBALL" -C "$TEST_DIR"
          PACKAGE_DIR=$(echo "$TEST_DIR"/villagesql-dev-server-*)
          source/villagesql/dev_server/tests/integration_test.sh "$PACKAGE_DIR"
          rm -rf "$TEST_DIR"

      - name: Upload dev package
        uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.platform }}
          path: ${{ env.OUTPUT_DIR }}/villagesql-dev-server-*.tar.gz

  # ── Publish to release ────────────────────────────────────────────────────
  publish:
    name: Attach Release Artifacts
    needs: [package-symbols, package-prod, package-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download symbols
        uses: actions/download-artifact@v4
        with:
          pattern: symbols-*
          merge-multiple: true
          path: packages/

      - name: Download prod packages
        uses: actions/download-artifact@v4
        with:
          pattern: prod-*
          merge-multiple: true
          path: packages/

      - name: Download dev packages
        uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          merge-multiple: true
          path: packages/

      - name: Download SDK packages
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          merge-multiple: true
          path: packages/

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release upload "$TAG" packages/*.tar.gz --clobber
